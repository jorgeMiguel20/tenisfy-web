# .github/workflows/import-ulanka.yml
#
# Importação dos ténis desportivos e de lifestyle da Ulanka (ficheiro de
# produtos da Tradedoubler, feed 258453). Corre SÓ À MÃO em "Run workflow" no
# separador Actions do GitHub (sem horário): o Jorge aprova primeiro o lote de
# teste. Depois de aprovado, junta-se o horário diário (depois das importações
# da manhã) e a atualização do resumo do catálogo das 08:50 trata do resto. As
# chaves vêm dos "secrets" do repositório - nunca ficam escritas aqui.
#
# Modos:
#   test    - cria até "limit" ténis novos ESCONDIDOS, para revisão (não
#             escreve ofertas em ténis que já existem)
#   full    - importa tudo, atualiza preços/stock e trata as fotos; com
#             "activate_new" ligado, os ténis com foto tratada e stock
#             ficam visíveis no site
#   photos  - só trata as fotos que faltam (não lê o ficheiro da loja)
#   review  - não altera nada: guarda uma folha com as fotos dos ténis
#             escondidos (endereço no fim do registo), para o Jorge ver
name: Importar Ulanka

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test, full, photos ou review'
        required: true
        default: test
        type: choice
        options: [test, full, photos, review]
      limit:
        description: 'test: quantos ténis novos criar'
        required: false
        default: '50'
      activate_new:
        description: 'full/photos: os ténis com foto tratada ficam visíveis no site?'
        required: false
        default: false
        type: boolean

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: https://byuxqagyeideqeurplho.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TRADEDOUBLER_TOKEN: ${{ secrets.TRADEDOUBLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # O tratamento das fotos usa a biblioteca "sharp", instalada numa
      # pasta à parte para não instalar o site inteiro.
      - name: Preparar o importador
        run: |
          mkdir -p /tmp/imp
          cp scripts/feed-stream.mjs scripts/feed-photos.mjs scripts/import-ulanka.mjs /tmp/imp/
          cd /tmp/imp
          npm init -y > /dev/null
          npm install --no-audit --no-fund sharp@0.34.5
      - name: Importar ténis da Ulanka
        env:
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit || '50' }}
          ACTIVATE_NEW: ${{ inputs.activate_new }}
        run: node /tmp/imp/import-ulanka.mjs
