# .github/workflows/import-directvolley.yml
#
# Importação do calçado da Direct-Volley PT (ficheiro de produtos da Awin,
# feed 95032). Por agora corre SÓ À MÃO em "Run workflow" no separador
# Actions do GitHub (sem horário): o Jorge aprova primeiro o lote de teste.
# Depois de aprovado, junta-se o horário diário (depois das importações da
# manhã: 03:13, 04:43 e 06:43 UTC) e a atualização do resumo do catálogo
# das 08:50 trata do resto. As chaves vêm dos "secrets" do repositório -
# nunca ficam escritas aqui.
#
# Modos:
#   test    - cria até "limit" ténis novos ESCONDIDOS, para revisão (não
#             escreve ofertas em ténis que já existem)
#   full    - importa tudo, atualiza preços/stock e trata as fotos; com
#             "activate_new" ligado, os ténis com foto tratada e stock
#             ficam visíveis no site
#   photos  - só trata as fotos que faltam (não lê o ficheiro da loja)
#   embeddings - só prepara a pesquisa por foto dos ténis importados que
#             ainda não estão preparados
#   review  - não altera nada: guarda uma folha com as fotos dos ténis
#             escondidos (endereço no fim do registo), para o Jorge ver
name: Importar Direct-Volley

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test, full, photos, embeddings ou review'
        required: true
        default: test
        type: choice
        options: [test, full, photos, embeddings, review]
      limit:
        description: 'test: quantos ténis novos criar'
        required: false
        default: '50'
      activate_new:
        description: 'full/photos: os ténis com foto tratada ficam visíveis no site?'
        required: false
        default: false
        type: boolean
      categories:
        description: 'full: categorias a importar, separadas por vírgulas (vazio = todas)'
        required: false
        default: 'running,treino,futebol,indoor'
      embed_minutes:
        description: 'embeddings/full: minutos máximos para preparar a pesquisa por foto'
        required: false
        default: '20'

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUN_MODE: ${{ inputs.mode }}
      # Links de afiliado da Direct-Volley: vazio = não mexe (continuam
      # desligados até o Jorge aprovar; ver scripts/import-directvolley.mjs).
      AFFILIATE_LINKS: ''
      SUPABASE_URL: https://byuxqagyeideqeurplho.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AWIN_API_KEY: ${{ secrets.AWIN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # O tratamento das fotos usa a biblioteca "sharp", instalada numa
      # pasta à parte para não instalar o site inteiro.
      - name: Preparar o importador
        if: env.RUN_MODE != 'embeddings'
        run: |
          mkdir -p /tmp/imp
          cp scripts/feed-photos.mjs scripts/awin-csv.mjs scripts/import-directvolley.mjs /tmp/imp/
          cd /tmp/imp
          npm init -y > /dev/null
          npm install --no-audit --no-fund sharp@0.34.5
      - name: Importar calçado da Direct-Volley
        if: env.RUN_MODE != 'embeddings'
        env:
          MODE: ${{ env.RUN_MODE }}
          LIMIT: ${{ inputs.limit || '50' }}
          ACTIVATE_NEW: ${{ inputs.activate_new }}
          CATEGORIES: ${{ inputs.categories }}
        run: node /tmp/imp/import-directvolley.mjs
      # Pesquisa por foto: o mesmo modelo que o site usa no browser. Pára ao
      # fim do tempo indicado e continua na vez seguinte com os que faltarem.
      - name: Preparar a pesquisa por foto
        if: env.RUN_MODE == 'full' || env.RUN_MODE == 'embeddings'
        env:
          EMBED_MAX_MINUTES: ${{ inputs.embed_minutes || '20' }}
        run: |
          mkdir -p /tmp/emb
          cp scripts/feed-embeddings.mjs /tmp/emb/
          cd /tmp/emb
          npm init -y > /dev/null
          npm install --no-audit --no-fund @huggingface/transformers@4.2.0
          node /tmp/emb/feed-embeddings.mjs
