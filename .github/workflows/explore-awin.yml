# .github/workflows/explore-awin.yml
#
# Explora um ficheiro de produtos da Awin (só lê e escreve um resumo no
# registo da execução; não mexe no site nem na base de dados). Corre à mão em
# "Run workflow" no separador Actions, indicando o número do ficheiro.
name: Explorar ficheiro Awin

on:
  workflow_dispatch:
    inputs:
      feed_id:
        description: 'Número do ficheiro (feed) da Awin'
        required: true
        default: '92150'

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWIN_API_KEY: ${{ secrets.AWIN_API_KEY }}
      AWIN_FEED_ID: ${{ inputs.feed_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Explorar o ficheiro
        run: node scripts/explore-awin.mjs
