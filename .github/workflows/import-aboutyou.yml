# .github/workflows/import-aboutyou.yml
#
# Importação dos ténis da About You (ficheiro de produtos da Tradedoubler).
# Corre sozinho todos os dias às 04:43 (hora UTC), nos servidores do
# GitHub (não precisa do computador do Jorge ligado), no modo "full", com
# os ténis novos a ficarem logo visíveis - pedido do Jorge em 2026-10-19.
# Também se pode correr à mão em "Run workflow" no separador Actions do
# GitHub. As chaves vêm dos "secrets" do repositório - nunca ficam
# escritas aqui.
#
# Modos:
#   explore - só conta o que há no ficheiro, não muda nada no site
#   test    - cria até "limit" ténis novos ESCONDIDOS, para revisão
#   full    - importa tudo, atualiza preços/stock e trata as fotos; com
#             "activate_new" ligado, os ténis com foto tratada e stock
#             ficam visíveis no site
#   photos  - só trata as fotos que faltam (não lê o ficheiro da loja)
#   embeddings - só prepara a pesquisa por foto dos ténis importados que
#             ainda não estão preparados (o modo full também o faz no fim)
name: Importar About You

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'explore, test, full, photos ou embeddings'
        required: true
        default: explore
        type: choice
        options: [explore, test, full, photos, embeddings]
      limit:
        description: 'test: quantos ténis novos criar'
        required: false
        default: '50'
      activate_new:
        description: 'full/photos: os ténis com foto tratada ficam visíveis no site?'
        required: false
        default: false
        type: boolean

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Quando corre sozinho (schedule) não há escolhas: modo full, ténis
      # novos visíveis.
      RUN_MODE: ${{ inputs.mode || 'full' }}
      SUPABASE_URL: https://byuxqagyeideqeurplho.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TRADEDOUBLER_TOKEN: ${{ secrets.TRADEDOUBLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Explorar o ficheiro da About You
        if: env.RUN_MODE == 'explore'
        run: node scripts/feed-explore.mjs
      # O tratamento das fotos usa a biblioteca "sharp". É instalada numa
      # pasta à parte para não instalar o site inteiro.
      - name: Preparar o importador
        if: env.RUN_MODE != 'explore' && env.RUN_MODE != 'embeddings'
        run: |
          mkdir -p /tmp/imp
          cp scripts/feed-stream.mjs scripts/feed-photos.mjs scripts/import-aboutyou.mjs /tmp/imp/
          cd /tmp/imp
          npm init -y > /dev/null
          npm install --no-audit --no-fund sharp@0.34.5
      - name: Importar ténis da About You
        if: env.RUN_MODE != 'explore' && env.RUN_MODE != 'embeddings'
        env:
          MODE: ${{ env.RUN_MODE }}
          LIMIT: ${{ inputs.limit || '50' }}
          ACTIVATE_NEW: ${{ github.event_name == 'schedule' || inputs.activate_new }}
        run: node /tmp/imp/import-aboutyou.mjs
      # Pesquisa por foto: o mesmo modelo que o site usa no browser.
      - name: Preparar a pesquisa por foto
        if: env.RUN_MODE == 'full' || env.RUN_MODE == 'embeddings'
        run: |
          mkdir -p /tmp/emb
          cp scripts/feed-embeddings.mjs /tmp/emb/
          cd /tmp/emb
          npm init -y > /dev/null
          npm install --no-audit --no-fund @huggingface/transformers@4.2.0
          node /tmp/emb/feed-embeddings.mjs
